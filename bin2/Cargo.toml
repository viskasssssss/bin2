[package]
name = "bin2"
version = "0.2.4"
description = "Simple binary serialization and deserialization for Rust"
license = "MIT OR Apache-2.0"
readme = "crates-io.md"
repository = "https://github.com/viskasssssss/bin2"
edition = "2024"
keywords = ["serialization", "binary"]

[dependencies]
bin2-derive = { version = "0.1", optional = true, path = "../bin2-derive" }

[features]
derive = ["bin2-derive"]